# configs/single_drone.yaml
env:
  x_max: 25.0
  y_max: 25.0
  max_altitude: 10.0
  max_speed: 8.0
  dt: 0.05
  max_steps: 500

reward:
  cell_size: 2.5
  coverage_bonus: 1.0
  revisit_penalty: 0.0
  boundary_penalty: 10.0

agent:
  type: td3  # td3 | sac | ddpg  (overridable via --algo)
  lr_actor: 0.0001
  lr_critic: 0.001
  gamma: 0.99
  tau: 0.005
  hidden: 256
  buffer_capacity: 100000
  normalize_obs: true
  normalize_rew: true
  # td3 / ddpg only
  policy_delay: 2
  noise:
    kind: decay
    dim: 4  # overridden at runtime by factory to match actual action_dim
    per: episode
    gamma: 0.995
    scale_min: 0.02
    base:
      kind: gaussian
      dim: 4  # overridden at runtime by factory to match actual action_dim
      sigma: 0.3
  # sac only
  lr_alpha: 0.0003
  init_alpha: 0.2
  auto_tune_alpha: true

training:
  num_episodes: 2000
  warmup_steps: 1000
  batch_size: 64
  save_every: 500
  rollout_every: 100
  wandb: false

output_dir: outputs
device: cpu

radar:
  port: /dev/rfcomm0   # Linux BT SPP; set to null to disable radar
