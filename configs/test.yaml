# configs/test.yaml — tiny env for fast CI
env:
  x_max: 10.0
  y_max: 10.0
  max_altitude: 5.0
  max_speed: 8.0
  dt: 0.05
  max_steps: 20
  n_drones: 2
  min_separation: 1.0

reward:
  cell_size: 2.0
  coverage_bonus: 1.0
  revisit_penalty: 0.0
  boundary_penalty: 10.0
  proximity_penalty: 5.0

agent:
  lr_actor: 0.001
  lr_critic: 0.001
  gamma: 0.99
  tau: 0.005
  hidden: 64
  buffer_capacity: 1000
  noise:
    kind: gaussian
    dim: 8
    sigma: 0.1

training:
  num_episodes: 2
  warmup_steps: 10
  batch_size: 10
  save_every: 1
  rollout_every: 1

output_dir: outputs/test
device: cpu
